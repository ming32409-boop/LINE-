name: Deploy Studio (Cloudflare + Pages)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  configure-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm ci --prefix worker
      - run: npm run test:deployment && npm run test:worker
      - name: Provision Cloudflare, deploy Worker, and build frontend
        run: node scripts/cloudflare-deploy.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ vars.WORKER_NAME }}
          SITE_URL: ${{ vars.SITE_URL }}
          DEFAULT_MODEL: ${{ vars.DEFAULT_MODEL }}
          STORE_URL: ${{ vars.STORE_URL }}
          DONATION_URL: ${{ vars.DONATION_URL }}
          CONTACT_URL: ${{ vars.CONTACT_URL }}
          CREATOR_COPYRIGHT: ${{ vars.CREATOR_COPYRIGHT }}
          CREATOR_ENGLISH: ${{ vars.CREATOR_ENGLISH }}
          CREATOR_CHINESE: ${{ vars.CREATOR_CHINESE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: [build, configure-pages]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
